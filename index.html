<!doctype html>
<html lang="en">
  <head>
    <!-- 🔥 Basic Meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- 🔥 Title -->
    <title>MCP AI Assistant | Smart AI Tools + Deep Research</title>

    <!-- 🔥 SEO -->
    <meta
      name="description"
      content="MCP AI Assistant is an advanced AI agent platform that integrates Gmail, Google Calendar, GitHub, and deep research capabilities using LangChain and Groq."
    />
    <meta
      name="keywords"
      content="AI Agent, MCP, LangChain, Groq, AI tools, Gmail automation, GitHub AI, Deep Search, Agentic AI"
    />
    <meta name="author" content="Abhijeet Soni" />

    <!-- 🔥 Favicon (Better support) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/ai.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/ai.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/ai.png" />

    <!-- 🔥 Open Graph (Social Sharing) -->
    <meta property="og:title" content="MCP AI Assistant" />
    <meta
      property="og:description"
      content="AI-powered assistant with tool execution, MCP integration, and deep research capabilities."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-domain.com" />
    <meta property="og:image" content="/preview.png" />

    <!-- 🔥 Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MCP AI Assistant" />
    <meta
      name="twitter:description"
      content="Smart AI assistant with MCP tools, automation, and deep search."
    />
    <meta name="twitter:image" content="/preview.png" />

    <!-- 🔥 Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- 🔥 Global Styles -->
    <style>
      body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background-color: #0a0a0a;
        color: #ffffff;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>

  <body>
    <!-- 🔥 React Root -->
    <div id="root"></div>

    <!-- 🔥 Main Script -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
